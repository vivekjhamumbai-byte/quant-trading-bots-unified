<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bot Trading System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0066cc;
            --primary-dark: #004399;
            --success: #00cc66;
            --danger: #ff3333;
            --warning: #ffaa00;
            --bg-dark: #0a0e27;
            --bg-card: #1a1f3a;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border: #2d3748;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .navbar {
            background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .navbar-brand span { color: var(--success); }
        
        .navbar-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0,204,102,0.1);
            border-radius: 20px;
            border: 1px solid var(--success);
            font-size: 0.875rem;
            color: var(--success);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .login-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,102,204,0.4);
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .auth-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .auth-overlay.active {
            display: flex;
        }
        
        .auth-modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .auth-modal h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1rem;
            letter-spacing: 4px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        
        .auth-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .auth-btn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .dashboard { display: none; }
        .dashboard.active { display: block; }
        
        .header-section {
            margin-bottom: 2rem;
        }
        
        .header-section h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-section p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0,102,204,0.1);
            transform: translateY(-4px);
        }
        
        .metric-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .metric-value.positive { color: var(--success); }
        .metric-value.negative { color: var(--danger); }
        .metric-value.neutral { color: var(--primary); }
        
        .metric-change {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .bots-section h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        
        .bots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .bot-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .bot-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--border);
        }
        
        .bot-card.running::before {
            background: var(--success);
        }
        
        .bot-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0,102,204,0.1);
            transform: translateY(-4px);
        }
        
        .bot-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .bot-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .bot-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: rgba(0,204,102,0.1);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--success);
            border: 1px solid var(--success);
        }
        
        .bot-status.idle {
            background: rgba(160,174,192,0.1);
            color: var(--text-secondary);
            border-color: var(--text-secondary);
        }
        
        .bot-stat {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }
        
        .bot-stat:last-child {
            border-bottom: none;
        }
        
        .bot-stat-label {
            color: var(--text-secondary);
        }
        
        .bot-stat-value {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .bot-pnl {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 1.25rem;
            font-weight: 700;
        }
        
        .bot-pnl.positive { color: var(--success); }
        .bot-pnl.negative { color: var(--danger); }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,102,204,0.4);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #ff1111;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,51,51,0.4);
        }
        
        .timestamp {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .bots-grid { grid-template-columns: 1fr; }
            .navbar { padding: 1rem; }
            .navbar-brand { font-size: 1.25rem; }
        }
        
        .loading {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            <span>█</span> Trading System
        </div>
        <div class="navbar-controls">
            <div class="status-indicator" id="statusIndicator">
                <div class="status-dot"></div>
                <span id="statusText">Authenticating...</span>
            </div>
            <button class="login-btn" id="loginBtn" onclick="showAuthModal()">Login TOTP</button>
        </div>
    </nav>
    
    <!-- AUTH MODAL -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <h2>8-Bot Trading</h2>
            <form onsubmit="authenticate(event)">
                <div class="form-group">
                    <label for="totpInput">TOTP Code (6 digits)</label>
                    <input type="text" id="totpInput" placeholder="000000" maxlength="6" inputmode="numeric" required />
                </div>
                <button type="submit" class="auth-btn" id="authSubmit">Authenticate</button>
            </form>
            <div id="authError" style="color: var(--danger); margin-top: 1rem; font-size: 0.875rem; text-align: center;"></div>
        </div>
    </div>
    
    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <div class="container">
            <!-- HEADER -->
            <div class="header-section">
                <h1>Trading Dashboard</h1>
                <p>Real-time monitoring of 8 trading bots</p>
            </div>
            
            <!-- METRICS -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Total P&L</div>
                    <div class="metric-value neutral" id="totalPnl">+0</div>
                    <div class="metric-change">Today</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Total Trades</div>
                    <div class="metric-value neutral" id="totalTrades">0</div>
                    <div class="metric-change">All time</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Win Rate</div>
                    <div class="metric-value neutral" id="winRate">0%</div>
                    <div class="metric-change">Success rate</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Bots Running</div>
                    <div class="metric-value neutral" id="botsRunning">0/8</div>
                    <div class="metric-change">Active</div>
                </div>
            </div>
            
            <!-- CONTROLS -->
            <div class="controls">
                <button class="btn btn-primary" onclick="refreshDashboard()">Refresh</button>
                <button class="btn btn-danger" onclick="stopAllBots()">Emergency Stop</button>
                <button class="btn btn-primary" onclick="logout()">Logout</button>
            </div>
            
            <!-- BOTS -->
            <div class="bots-section">
                <h2>Bot Status</h2>
                <div class="bots-grid" id="botsGrid"></div>
            </div>
            
            <div class="timestamp" id="timestamp">Last updated: now</div>
        </div>
    </div>
    
    <script>
        const API = window.location.origin;
        let isAuthenticated = false;
        
        function showAuthModal() {
            document.getElementById('authOverlay').classList.add('active');
            document.getElementById('totpInput').focus();
        }
        
        function hideAuthModal() {
            document.getElementById('authOverlay').classList.remove('active');
        }
        
        async function authenticate(e) {
            e.preventDefault();
            const totp = document.getElementById('totpInput').value.trim();
            if (totp.length !== 6 || isNaN(totp)) {
                document.getElementById('authError').textContent = 'Must be 6 digits';
                return;
            }
            
            const btn = document.getElementById('authSubmit');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            
            try {
                const r = await fetch(API + '/api/auth/totp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ totp_code: totp })
                });
                const d = await r.json();
                if (r.ok) {
                    isAuthenticated = true;
                    hideAuthModal();
                    updateStatus('Connected');
                    document.getElementById('dashboard').classList.add('active');
                    loadDashboard();
                    setInterval(loadDashboard, 3000);
                } else {
                    document.getElementById('authError').textContent = d.message || 'Failed';
                }
            } catch(e) {
                document.getElementById('authError').textContent = 'Error: ' + e.message;
            }
            btn.disabled = false;
            btn.textContent = 'Authenticate';
        }
        
        function updateStatus(text) {
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusIndicator').style.color = 'var(--success)';
        }
        
        async function loadDashboard() {
            if (!isAuthenticated) return;
            try {
                const [s, b] = await Promise.all([
                    fetch(API + '/api/dashboard/summary').then(r => r.json()),
                    fetch(API + '/api/dashboard/bots').then(r => r.json())
                ]);
                
                const pnlEl = document.getElementById('totalPnl');
                pnlEl.textContent = formatNum(s.total_pnl);
                pnlEl.className = 'metric-value ' + (s.total_pnl >= 0 ? 'positive' : 'negative');
                
                document.getElementById('totalTrades').textContent = s.total_trades;
                document.getElementById('winRate').textContent = s.win_rate + '%';
                document.getElementById('botsRunning').textContent = s.bots_running + '/8';
                
                const grid = document.getElementById('botsGrid');
                grid.innerHTML = b.bots.map(bot => 
                    <div class="bot-card ">
                        <div class="bot-header">
                            <div class="bot-name"></div>
                            <div class="bot-status ">
                                
                            </div>
                        </div>
                        <div class="bot-stat">
                            <span class="bot-stat-label">Trades</span>
                            <span class="bot-stat-value"></span>
                        </div>
                        <div class="bot-pnl ">
                            
                        </div>
                    </div>
                ).join('');
                
                document.getElementById('timestamp').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
            } catch(e) {
                console.error(e);
            }
        }
        
        function formatNum(n) {
            const v = Math.abs(n).toLocaleString('en-IN');
            return (n >= 0 ? '+' : '-') + v;
        }
        
        function refreshDashboard() { loadDashboard(); }
        
        async function stopAllBots() {
            if (!confirm('Stop all bots immediately?')) return;
            await fetch(API + '/api/control/stop-all', { method: 'POST' });
        }
        
        function logout() {
            isAuthenticated = false;
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('totpInput').value = '';
            showAuthModal();
        }
        
        document.getElementById('totpInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') authenticate(e);
        });
        
        showAuthModal();
    </script>
</body>
</html>
