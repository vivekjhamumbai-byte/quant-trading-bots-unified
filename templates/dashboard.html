<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>8-Bot Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f172a;color:#e2e8f0}header{background:#1e293b;border-bottom:2px solid #64748b;padding:20px}.container{max-width:1200px;margin:0 auto;padding:20px}.auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a}.auth-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:40px;max-width:400px}.auth-card h2{text-align:center;color:#0ea5e9;margin-bottom:20px}.totp-input{width:100%;padding:12px;border:2px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:18px;text-align:center;margin-bottom:20px}.auth-button{width:100%;padding:12px;background:#0ea5e9;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer}.dashboard{display:none}.dashboard.active{display:block}.summary{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:20px;margin-bottom:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}.summary-item h4{color:#94a3b8;font-size:12px;text-transform:uppercase;margin-bottom:8px}.summary-item .value{font-size:24px;font-weight:700;color:#0ea5e9}.summary-item .value.positive{color:#10b981}.summary-item .value.negative{color:#f87171}.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.bot-card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:15px}.bot-card h3{color:#0ea5e9;font-size:14px;margin-bottom:10px}.bot-pnl{font-size:18px;font-weight:700;text-align:right}.positive{color:#10b981!important}.negative{color:#f87171!important}.controls{display:flex;gap:10px;margin-bottom:20px}.btn{padding:10px 20px;border:none;border-radius:6px;font-weight:600;cursor:pointer}.btn-primary{background:#0ea5e9;color:white}.btn-danger{background:#f87171;color:white}</style></head><body><div class="auth-screen" id="authScreen"><div class="auth-card"><h2>8-BOT TRADING</h2><label>TOTP Code (6 digits):</label><input class="totp-input" id="totpInput" placeholder="000000" maxlength="6" inputmode="numeric"/><button class="auth-button" id="authButton">Authenticate</button><div id="errorMessage" style="color:#f87171;margin-top:10px"></div></div></div><div class="dashboard" id="dashboard"><header><div class="container"><h1>8-Bot Trading Dashboard</h1></div></header><div class="container"><div class="summary"><div class="summary-item"><h4>P&L</h4><div class="value" id="totalPnl">+0</div></div><div class="summary-item"><h4>Trades</h4><div class="value" id="totalTrades">0</div></div><div class="summary-item"><h4>Win%</h4><div class="value" id="winRate">0%</div></div><div class="summary-item"><h4>Bots</h4><div class="value" id="botsRunning">0/8</div></div></div><div class="controls"><button class="btn btn-primary" onclick="updateDashboard()">Refresh</button><button class="btn btn-danger" onclick="stopAll()">STOP ALL</button></div><div class="status-grid" id="statusGrid"></div></div></div><script>const API=window.location.origin;const auth=document.getElementById("authScreen");const dash=document.getElementById("dashboard");const totp=document.getElementById("totpInput");const btn=document.getElementById("authButton");btn.addEventListener("click",authenticate);totp.addEventListener("keypress",e=>{if(e.key==="Enter")authenticate()});async function authenticate(){const code=totp.value.trim();if(code.length!==6||isNaN(code)){showErr("6 digits only");return}btn.disabled=true;try{const r=await fetch(API+"/api/auth/totp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({totp_code:code})});const d=await r.json();if(r.ok){auth.style.display="none";dash.classList.add("active");load();setInterval(load,3000)}else{showErr(d.message||"Failed")}}catch(e){showErr(e.message)}btn.disabled=false}function showErr(m){const e=document.getElementById("errorMessage");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",5000)}async function load(){try{const[s,b]=await Promise.all([fetch(API+"/api/dashboard/summary").then(r=>r.json()),fetch(API+"/api/dashboard/bots").then(r=>r.json())]);document.getElementById("totalPnl").textContent=fmt(s.total_pnl);document.getElementById("totalTrades").textContent=s.total_trades;document.getElementById("winRate").textContent=s.win_rate+"%";document.getElementById("botsRunning").textContent=s.bots_running+"/8";const g=document.getElementById("statusGrid");g.innerHTML=b.bots.map(x=>`<div class="bot-card"><h3>${x.name}</h3><div>Trades: ${x.trades}</div><div class="bot-pnl ${x.pnl>=0?"positive":"negative"}">${fmt(x.pnl)}</div></div>`).join("")}catch(e){console.error(e)}}function fmt(n){const v=Math.abs(n).toLocaleString("en-IN");return(n>=0?"+":"-")+v}async function updateDashboard(){await load()}async function stopAll(){if(confirm("Stop all?")){await fetch(API+"/api/control/stop-all",{method:"POST"})}}totp.focus()</script></body></html>
